name: Build Samsung Tab A7 (LineageOS 24 A17)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_gta4l"
  DEVICE_CODENAME : "gta4l"

  # ضبط المترجم
  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu-"
  EXTRA_CMDS : ""

  # المستودع النظيف الأساسي لمعالج SM6115
  KERNEL_SOURCE : "https://github.com/sanfor30/android_kernel_samsung_sm6115"
  KERNEL_BRANCH : "lineage-24.0"

  CLANG_SOURCE : ""
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "gta4l_eur_open_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # إعدادات دمج KernelSU Next تلقائياً
  KERNELSU_SOURCE : "https://github.com/rifsxd/KernelSU-Next"
  KERNELSU_BRANCH : "next"

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "next"
  KERNELSU_METHOD: "kprobe"

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos24_a17"

  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mainline"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "true"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Samsung Tab A7 (LineageOS 24 A17)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      KCFLAGS: "-Wno-error"
      KAFLAGS: "-Wno-error"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🚀 Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1
        with:
          exclude-current: true

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪛 Extra Kernel & Performance Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # 1. تعديل اسم النواة
          sed -i 's/CONFIG_LOCALVERSION="-Paradigm"/CONFIG_LOCALVERSION="-ENIGMA"/g' arch/arm64/configs/gta4l_eur_open_defconfig
          echo "[+] Kernel name updated to -ENIGMA"
          
          # 2. تفعيل دعم Kprobes الإلزامي لـ KernelSU والتحسينات الأساسية
          cat <<EOF >> arch/arm64/configs/gta4l_eur_open_defconfig
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_COMPAT=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_DEFAULT_NET_SCH="fq_codel"
          CONFIG_WIREGUARD=y
          EOF
          echo "[+] Kprobes and tweaks added successfully"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")

          cd $GITHUB_WORKSPACE/device_kernel/
          if [[ -d "arch/arm64/configs" ]]; then
            IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot"
          else
            IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/arm/boot"
          fi

          mkdir -p tmp

          if [[ "${{ env.AK3_SOURCE }}" =~ "osm0sis" ]]; then
            sed -i 's|ExampleKernel by osm0sis @ xda-developers|NonGKI Kernel Build by JackAltman @ GitHub|g' AnyKernel3/anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
            sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
            sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
            echo "Now using official AnyKernel3."
          fi

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp $IMAGE_DIR/Image.gz-dtb tmp
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp $IMAGE_DIR/Image.gz tmp
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            cp -fp $IMAGE_DIR/Image tmp
          fi

          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp $IMAGE_DIR/dtb.img tmp/dtb
          elif [ -f "$IMAGE_DIR/dtb" ]; then
            cp -fp $IMAGE_DIR/dtb tmp
          elif [ "${{ env.GENERATE_DTB }}" == "true" ]; then
            if ls $IMAGE_DIR/dts/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts"
            elif ls $IMAGE_DIR/dts/vendor/${{ env.GENERATE_CHIP }}/*.dtb 1> /dev/null 2>&1; then
                DTB_PATH="dts/vendor"
            fi
            cat $IMAGE_DIR/$DTB_PATH/${{ env.GENERATE_CHIP }}/*.dtb > $IMAGE_DIR/dtb
            cp -fp $IMAGE_DIR/dtb tmp
          fi

          cp -rp ./AnyKernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..

          cp -fp tmp/tmp.zip ${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip
          rm -rf tmp

          echo "PACK_NAME=${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-$TIME-${{ env.PACK_METHOD }}.zip" >> $GITHUB_ENV

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
