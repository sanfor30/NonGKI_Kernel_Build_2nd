name: Build Custom Kernel (gta4l)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          git clone https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git --depth=1 gcc64
          git clone https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabihf.git --depth=1 gcc32
          curl -L https://github.com/nduykha/android_kernel_samsung_sm6115/releases/download/clang/llvm.tar.xz -o clang.tar.xz
          mkdir clang && tar -xf clang.tar.xz -C clang

      - name: Apply Defconfig & OverlayFS Tweaks
        run: |
          # تعديل ملف الإعدادات لتفعيل خصائص OverlayFS
          echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" >> arch/arm64/configs/gta4l_eur_open_defconfig
          echo "CONFIG_OVERLAY_FS_INDEX=y" >> arch/arm64/configs/gta4l_eur_open_defconfig
          echo "CONFIG_OVERLAY_FS_METACOPY=y" >> arch/arm64/configs/gta4l_eur_open_defconfig
          echo "CONFIG_COMPAT=y" >> arch/arm64/configs/gta4l_eur_open_defconfig
          
          # تحديث اسم النواة
          sed -i 's/CONFIG_LOCALVERSION="-Paradigm"/CONFIG_LOCALVERSION="-ENIGMA"/g' arch/arm64/configs/gta4l_eur_open_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc32/bin/arm-linux-gnueabihf-
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          make O=out gta4l_eur_open_defconfig
          make O=out -j$(nproc) LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' anykernel.sh
          zip -r9 ../Custom_Kernel_gta4l.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom_Kernel_Zip
          path: Custom_Kernel_gta4l.zip
